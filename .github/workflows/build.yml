name: IslandPro Rootless Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize build diagnostics
        run: echo "IslandPro build preflight" > build.log
      - name: Install toolchain
        run: |
          set -euo pipefail
          brew install ldid make 2>&1 | tee -a build.log
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos" 2>&1 | tee -a build.log
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          if ! find "$HOME/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' 2>/dev/null | grep -q .; then
            rm -rf "$HOME/theos/sdks"
            git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks" 2>&1 | tee -a build.log
          fi
          find "$HOME/theos/sdks" -maxdepth 1 -name 'iPhoneOS*.sdk' -print | tee -a build.log
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -name 'iPhoneOS*.sdk' -print -quit)"
      - name: Validate source and preferences
        run: |
          set -euo pipefail
          plutil -lint islandproprefs/Resources/Info.plist 2>&1 | tee -a build.log
          plutil -lint islandproprefs/Resources/Root.plist 2>&1 | tee -a build.log
          plutil -lint layout/Library/PreferenceLoader/Preferences/IslandPro.plist 2>&1 | tee -a build.log
          plutil -lint IslandPro.plist 2>&1 | tee -a build.log
          /usr/bin/python3 - <<'PY' 2>&1 | tee -a build.log
          import plistlib
          from pathlib import Path
          root = plistlib.loads(Path("islandproprefs/Resources/Root.plist").read_bytes())
          keys = [item.get("key") for item in root if item.get("key")]
          assert len(keys) == len(set(keys)), "Duplicate preference keys"
          for item in root:
              if item.get("cell") in ("PSSwitchCell", "PSSliderCell"):
                  assert item.get("get") == "readPreferenceValue:", item
                  assert item.get("set") == "setPreferenceValue:specifier:", item
          print("Preference controls and keys: OK")
          PY
          test -s Tweak.xm && test -s control && test -s Makefile
          test -s islandproprefs/IPRootListController.m
          test -s islandproprefs/Makefile
          grep -q "THEOS_PACKAGE_SCHEME := rootless" Makefile
          grep -q "Architecture: iphoneos-arm64" control
      - name: Compile and package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1 messages=yes 2>&1 | tee -a build.log
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          echo "Produced packages:" | tee -a build.log
          find packages -maxdepth 1 -name '*.deb' -exec ls -lh {} \; | tee -a build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IslandPro-Build-Logs
          path: build.log
          if-no-files-found: warn
      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IslandPro-DEB
          path: packages/*.deb
          if-no-files-found: error
