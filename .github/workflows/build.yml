name: IslandPro Rootless Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos and SDK
        run: |
          brew install ldid make
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          if [ ! -d "$HOME/theos/sdks" ] || [ -z "$(ls -A "$HOME/theos/sdks" 2>/dev/null)" ]; then
            rm -rf "$HOME/theos/sdks"
            git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          fi
      - name: Validate project resources
        run: |
          plutil -lint islandproprefs/Resources/Info.plist
          plutil -lint islandproprefs/Resources/Root.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/IslandPro.plist
          test -f Tweak.xm && test -f IslandPro.plist && test -f control
      - name: Compile DEB
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1
      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: IslandPro-DEB
          path: packages/*.deb
          if-no-files-found: error
