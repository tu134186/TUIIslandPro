name: IslandPro Rootless Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize diagnostics
        run: echo "IslandPro build preflight" > build.log
      - name: Install Theos and tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make dpkg fakeroot 2>&1 | tee -a build.log
          for tool in ldid dpkg-deb fakeroot; do command -v "$tool" | tee -a build.log; done
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos" 2>&1 | tee -a build.log
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          if ! find "$HOME/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' | grep -q .; then
            rm -rf "$HOME/theos/sdks"
            git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks" 2>&1 | tee -a build.log
          fi
          test -n "$(find "$HOME/theos/sdks" -maxdepth 1 -name 'iPhoneOS*.sdk' -print -quit)"
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint islandproprefs/Resources/Info.plist 2>&1 | tee -a build.log
          plutil -lint islandproprefs/Resources/Root.plist 2>&1 | tee -a build.log
          plutil -lint layout/Library/PreferenceLoader/Preferences/IslandPro.plist 2>&1 | tee -a build.log
          plutil -lint IslandPro.plist 2>&1 | tee -a build.log
          test -s Tweak.xm
          test -s islandproprefs/IPRootListController.m
          grep -q "THEOS_PACKAGE_SCHEME := rootless" Makefile
          grep -q "Architecture: iphoneos-arm64" control
      - name: Compile and verify package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          echo "Compiler: $(xcrun --find clang)" | tee -a build.log
          echo "SDK: $(xcrun --show-sdk-path --sdk iphoneos)" | tee -a build.log
          echo "Theos: $THEOS" | tee -a build.log
          make clean 2>&1 | tee -a build.log
          make package FINALPACKAGE=1 messages=yes 2>&1 | tee -a build.log
          test -n "$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          for deb in packages/*.deb; do
            test -s "$deb"
            dpkg-deb --info "$deb" 2>&1 | tee -a build.log
            dpkg-deb --contents "$deb" 2>&1 | tee -a build.log
            mkdir -p "$RUNNER_TEMP/islandpro-check"
            dpkg-deb --extract "$deb" "$RUNNER_TEMP/islandpro-check"
            root="$RUNNER_TEMP/islandpro-check/var/jb/Library"
            test -f "$root/MobileSubstrate/DynamicLibraries/IslandPro.dylib"
            test -f "$root/MobileSubstrate/DynamicLibraries/IslandPro.plist"
            test -f "$root/PreferenceBundles/IslandProPrefs.bundle/Root.plist"
            test -f "$root/PreferenceBundles/IslandProPrefs.bundle/Info.plist"
            test -f "$root/PreferenceLoader/Preferences/IslandPro.plist"
            echo "Rootless DEB payload verified" | tee -a build.log
            ls -lh "$deb" | tee -a build.log
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IslandPro-Build-Logs
          path: build.log
          if-no-files-found: warn
      - name: Upload DEB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: IslandPro-DEB
          path: packages/*.deb
          if-no-files-found: error
